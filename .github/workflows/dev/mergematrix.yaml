name: location pipeline config check

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  validate-config:
    runs-on: ubuntu-24.04
    container:
      # Keep this development workflow's historical image reference unchanged.
      image: ghcr.io/holygrolli/whatsupforlunch:sha-979e9b6-2024-08-08
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: validate all location YAML files
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pipeline.config import load_all

          configs = load_all()
          print(f"validated {len(configs)} locations: {', '.join(configs)}")
          PY
