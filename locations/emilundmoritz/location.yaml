schema_version: 1
name: Emil und Moritz
enabled: true
website:
  url: https://emil-und-moritz.de/
  details:
    - "Business-Lunch (Essen ohne Limit): 7,99 € plus Getränkepreis (9,99 € ohne Getränk)"
scrape:
  type: scrapy
  spider:
    allowed_domains: [emil-und-moritz.de]
    link_xpath: '//table/parent::div'
    item_key: div
    count: 2
    select_index: 1
    inline: true
    # The menu is re-published weekly on the constant homepage URL. Without a
    # fingerprint the state backend would track the page URL itself, so only
    # the very first cycle ever produced "new" links. The week label inside
    # the selected div ("Woche 14.09.2026 - 18.09.2026") is the per-menu
    # identity; every new week becomes a new link, older ones stay filtered.
    link_fingerprint_xpath: './/span/text()'
    clean_html: true
    safe_attrs: [src, alt, href, title]
    minify: true
download:
  formats: [html]
prepare:
  - reduce_to_text: {}
extract:
  type: text
  input_file: chatgpt_user.txt
  prompt_file: prompt.txt
  prompt_prefix: "The input is:\n"
  model:
    provider: openai
publish:
  week_key_from: first_date
schedule:
  cron: '10 5 * * 1'
